name: checks

on:
  push:
  pull_request:

concurrency:
  group: conduit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --bin conduit
      - run: python3 -m unittest discover -s eval -p "test_*.py"
        if: runner.os != 'Windows'
      - run: python -m unittest discover -s eval -p "test_*.py"
        if: runner.os == 'Windows'
      - run: python3 eval/benchmark.py --binary target/debug/conduit
        if: runner.os != 'Windows'
      - run: python eval/benchmark.py --binary target/debug/conduit.exe
        if: runner.os == 'Windows'
      - run: python3 eval/release_gate.py
        if: runner.os != 'Windows'
      - run: python eval/release_gate.py
        if: runner.os == 'Windows'

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
