[workspace]
members = [".", "crates/store", "crates/scope", "crates/lens", "crates/atlas", "crates/edit", "crates/ledger", "crates/relay", "crates/guard", "crates/verify", "crates/vault", "crates/memory", "crates/fanout"]
resolver = "2"

[package]
name = "conduit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
conduit-store = { path = "crates/store" }
conduit-scope = { path = "crates/scope" }
conduit-lens = { path = "crates/lens" }
conduit-atlas = { path = "crates/atlas" }
conduit-edit = { path = "crates/edit" }
conduit-ledger = { path = "crates/ledger" }
conduit-relay = { path = "crates/relay" }
conduit-guard = { path = "crates/guard" }
conduit-verify = { path = "crates/verify" }
conduit-vault = { path = "crates/vault" }
conduit-memory = { path = "crates/memory" }
conduit-fanout = { path = "crates/fanout" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
