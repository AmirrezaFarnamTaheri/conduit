[workspace]
members = [".", "crates/store", "crates/scope", "crates/lens", "crates/atlas", "crates/edit"]
resolver = "2"

[package]
name = "conduit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
conduit-store = { path = "crates/store" }
conduit-scope = { path = "crates/scope" }
conduit-lens = { path = "crates/lens" }
conduit-atlas = { path = "crates/atlas" }
conduit-edit = { path = "crates/edit" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
